name: Autopost katalog Annafi

on:
  schedule:
    - cron: "*/15 * * * *"   # cek tiap 15 menit (GitHub kadang telat beberapa menit)
  workflow_dispatch:          # tombol "Run workflow" untuk tes manual
    inputs:
      tes:
        description: "Hanya tes koneksi Telegram & cek pengaturan"
        type: boolean
        default: false
      contoh:
        description: "Kirim contoh poster (1 story + 1 feed terdekat) ke Telegram, tanpa posting"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: autopost
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
      META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
      META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
      MAKE_KUNCI: ${{ secrets.MAKE_KUNCI }}
      MAKE_REEL: ${{ vars.MAKE_REEL || '0' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      TTS_MESIN: ${{ vars.TTS_MESIN }}
      PREVIEW_JAM: ${{ vars.PREVIEW_JAM || '2' }}
      DRY_RUN: ${{ vars.DRY_RUN || '0' }}
      MODE_PROMO: ${{ vars.MODE_PROMO || '0' }}
      CAROUSEL: ${{ vars.CAROUSEL || '1' }}
      PUBLIC_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tes koneksi
        if: inputs.tes
        run: |
          pip install -q requests
          python src/main.py tes

      - name: Contoh poster
        if: inputs.contoh
        run: |
          pip install -q -r requirements.txt
          python -m playwright install --with-deps chromium
          python src/main.py contoh

      - name: Cek ringan
        id: cek
        if: ${{ !inputs.tes && !inputs.contoh }}
        run: |
          pip install -q requests
          python src/main.py cek

      - name: Pasang alat render
        if: steps.cek.outputs.perlu == '1'
        run: |
          command -v ffmpeg > /dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null)
          pip install -q -r requirements.txt edge-tts numpy
          python -m playwright install --with-deps chromium

      - uses: actions/cache@v4
        if: steps.cek.outputs.perlu == '1'
        with:
          path: ~/.rembg
          key: rembg-isnet-general-use-v1

      - name: Pratinjau & siapkan poster
        if: steps.cek.outputs.perlu == '1'
        run: python src/main.py prepare

      - name: Simpan poster (supaya punya URL publik)
        if: steps.cek.outputs.perlu == '1'
        run: |
          git config user.name "annafi-bot"
          git config user.email "annafi-bot@users.noreply.github.com"
          git add posters state cerita/papan cerita/suara_cache 2>/dev/null || git add posters state
          git diff --cached --quiet || (git commit -q -m "poster & status [skip ci]" && git push -q)
          sleep 5

      - name: Posting ke Instagram & Facebook
        if: steps.cek.outputs.perlu == '1'
        run: python src/main.py publish

      - name: Simpan status
        if: always() && steps.cek.outputs.perlu == '1'
        run: |
          git add state
          git diff --cached --quiet || (git commit -q -m "status [skip ci]" && git push -q)
