name: Render cerita (motion comic)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cerita/**.py"
      - ".github/workflows/cerita.yml"

permissions:
  contents: write

concurrency:
  group: cerita
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pasang alat
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q playwright edge-tts
          python -m playwright install --with-deps chromium > /dev/null
      - name: Render video + suara
        run: |
          python cerita/render_pembuka.py /tmp/bisu.mp4
          python cerita/suara.py /tmp/bisu.mp4 cerita/contoh/misteri_part1_pembuka_suara.mp4
      - name: Simpan hasil
        run: |
          git config user.name "annafi-bot"
          git config user.email "bot@users.noreply.github.com"
          git add cerita/contoh/
          git commit -m "contoh cerita bersuara [skip ci]" || echo "tidak ada perubahan"
          git pull --rebase -q origin main && git push -q origin main
