name: Render cerita (motion comic)

on:
  workflow_dispatch:
    inputs:
      mesin:
        description: "Mesin suara: gemini / eleven / edge (kosong = otomatis)"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "cerita/**.py"
      - ".github/workflows/cerita.yml"

permissions:
  contents: write

concurrency:
  group: cerita
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pasang alat
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q playwright edge-tts requests
          python -m playwright install --with-deps chromium > /dev/null
      - name: Render video + suara
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVEN_VOICE_NARATOR: ${{ vars.ELEVEN_VOICE_NARATOR }}
          ELEVEN_VOICE_NAFI: ${{ vars.ELEVEN_VOICE_NAFI }}
          ELEVEN_MODEL: ${{ vars.ELEVEN_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TTS_MESIN: ${{ inputs.mesin || vars.TTS_MESIN }}
        run: |
          M="${TTS_MESIN:-auto}"
          python cerita/part1_pembuka.py "cerita/contoh/misteri_part1_pembuka_${M}_v3.mp4"
      - name: Simpan hasil
        run: |
          git config user.name "annafi-bot"
          git config user.email "bot@users.noreply.github.com"
          git add cerita/contoh/
          git commit -m "contoh cerita bersuara [skip ci]" || echo "tidak ada perubahan"
          git pull --rebase -q origin main && git push -q origin main
