name: Cari foto produk

on:
  workflow_dispatch:
    inputs:
      produk:
        description: 'Daftar "Nama|KATEGORI" dipisah ; (atau POSTER:7 = render poster story 7 hari ke depan)'
        required: true

permissions:
  contents: write

jobs:
  cari:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - if: startsWith(inputs.produk, 'POSTER')
        run: python -m playwright install --with-deps chromium
      - uses: actions/cache@v4
        if: startsWith(inputs.produk, 'POSTER')
        with:
          path: ~/.rembg
          key: rembg-isnet-general-use-v1
      - name: Cari
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
          PRODUK: ${{ inputs.produk }}
        run: |
          if [[ "$PRODUK" == UNDUH* ]]; then IFS=";" read -ra P <<< "${PRODUK#UNDUH:}"; python tools/unduh_foto.py "${P[@]}"; exit 0; fi
          if [[ "$PRODUK" == POSTER* ]]; then IFS=';' read -ra P <<< "${PRODUK#POSTER:}"; python tools/cek_poster.py "${P[@]}"; exit 0; fi
          IFS=';' read -ra P <<< "$PRODUK"
          python tools/cari_foto.py "${P[@]}"
      - name: Simpan ke cabang sementara cek-foto (ditimpa tiap kali, dihapus setelah dicek)
        run: |
          cd cek_foto
          git init -q -b cek-foto && git config user.name "annafi-bot" && git config user.email "bot@users.noreply.github.com"
          git add . && git commit -q -m "cek foto"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" cek-foto
