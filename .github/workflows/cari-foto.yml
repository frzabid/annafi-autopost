name: Cari foto produk

on:
  workflow_dispatch:
    inputs:
      produk:
        description: 'Daftar "Nama|KATEGORI" dipisah ;'
        required: true

permissions:
  contents: write

jobs:
  cari:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - name: Cari
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          PRODUK: ${{ inputs.produk }}
        run: |
          IFS=';' read -ra P <<< "$PRODUK"
          python tools/cari_foto.py "${P[@]}"
      - name: Simpan
        run: |
          git config user.name "annafi-bot"
          git config user.email "bot@users.noreply.github.com"
          git add cek_foto && git commit -q -m "cek foto produk [skip ci]" && git pull --rebase -q && git push -q || true
