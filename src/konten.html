<!DOCTYPE html>
<html><head><meta charset="utf-8">
<!-- Poster feed 1080x1350 untuk edukasi / promo / info / momen -->
<style>
  @font-face{font-family:Poppins;font-weight:400;src:url({assets}/fonts/Poppins-Regular.ttf)}
  @font-face{font-family:Poppins;font-weight:700;src:url({assets}/fonts/Poppins-Bold.ttf)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:1080px;height:1350px;font-family:Poppins,sans-serif;background:#1565d8;overflow:hidden}
  .frame{position:absolute;inset:22px;background:#fdfdfd;border-radius:46px;overflow:hidden}
  .frame:before{content:"";position:absolute;inset:18px;border:3px dashed #9cc4f2;border-radius:34px}
  .wrap{position:absolute;top:56px;bottom:50px;left:64px;right:64px;display:flex;flex-direction:column}
  .top{display:flex;justify-content:space-between;align-items:center}
  .cat{color:#fff;font-weight:700;font-size:22px;padding:8px 22px;border-radius:40px;letter-spacing:2px;background:#1565d8}
  .cat.promo{background:#e8453c}.cat.momen{background:#8e44ad}.cat.info{background:#13a07a}
  .logo{height:80px}
  h1{font-weight:700;font-size:{ukuran_judul}px;line-height:1.08;color:#14213d;margin-top:22px}
  h1 em{font-style:normal;color:#1565d8}
  .sub{font-size:28px;color:#5b6475;margin-top:10px}
  .body{flex:1;min-height:0;display:flex;gap:28px;margin:26px 0 18px;align-items:center}
  .body.noimg .photo{display:none}
  .photo{flex:0 0 40%;height:100%;display:flex;align-items:center;justify-content:center}
  .photo img{max-height:100%;max-width:100%;object-fit:contain;filter:drop-shadow(0 16px 22px rgba(20,33,61,.18))}
  ol{list-style:none;flex:1;display:flex;flex-direction:column;gap:{jarak_poin}px;counter-reset:n}
  li{counter-increment:n;display:flex;gap:18px;align-items:flex-start;font-size:{ukuran_poin}px;line-height:1.3;color:#2b3447;background:#eef4fd;border-radius:22px;padding:16px 22px}
  li:before{content:counter(n);flex:none;width:46px;height:46px;border-radius:50%;background:#1565d8;color:#fff;font-weight:700;font-size:24px;display:flex;align-items:center;justify-content:center}
  li b{color:#14213d}
  .body.noimg ol{gap:22px}
  .body.noimg li{font-size:{ukuran_poin_besar}px;padding:22px 28px}
  .body.noimg li:before{width:56px;height:56px;font-size:28px}
  .pr.coret .val{text-decoration:line-through;text-decoration-thickness:4px;color:#8a93a6}
  .prices{display:flex;gap:20px;margin-bottom:18px}
  .prices:empty{display:none}
  .pr{flex:1;border-radius:26px;padding:16px 26px;background:#eef4fd;border:3px solid #d3e3fa}
  .pr.main{background:#1565d8;border-color:#1565d8}
  .pr.main .lbl{color:#d6e6fb}
  .pr.main .val{color:#fff}
  .pr .lbl{font-size:24px;font-weight:700;color:#3d4659}
  .pr .val{font-size:50px;font-weight:700;color:#14213d;line-height:1.1}
  .foot{border-top:2px dashed #c9dcf5;padding-top:16px;display:grid;grid-template-columns:1fr 1fr;row-gap:10px;column-gap:24px}
  .foot div{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700;color:#2b3447}
  .foot img,.foot .fb{width:30px;height:30px;border-radius:7px;flex:none}
  .foot .fb{background:#1877f2;color:#fff;font:700 24px/34px Poppins,sans-serif;text-align:center;overflow:hidden}
  .doodle{position:absolute;color:#7fb3ee;font-size:60px;opacity:.6}
</style></head>
<body><div class="frame">
  <div class="wrap">
    <div class="top"><span class="cat {jenis}">{label}</span><img class="logo" src="{assets}/logo.png"></div>
    <h1>{nama}</h1>
    <p class="sub">{detail}</p>
    <div class="body {kelas_body}">
      <div class="photo"><img src="{gambar}"></div>
      <ol>{poin_html}</ol>
    </div>
    <div class="prices">{harga_html}</div>
    <div class="foot">
      <div><img src="{assets}/ic_wa.png">{wa}</div>
      <div><img src="{assets}/ic_ig.png">{ig}</div>
      <div><span class="fb">f</span>{fb}</div>
      <div><img src="{assets}/ic_tt.png">{tiktok}</div>
    </div>
  </div>
</div></body></html>
