<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  @font-face{font-family:Poppins;font-weight:400;src:url({assets}/fonts/Poppins-Regular.ttf)}
  @font-face{font-family:Poppins;font-weight:600;src:url({assets}/fonts/Poppins-Bold.ttf)}
  @font-face{font-family:Poppins;font-weight:700;src:url({assets}/fonts/Poppins-Bold.ttf)}
  @font-face{font-family:Poppins;font-weight:800;src:url({assets}/fonts/Poppins-Bold.ttf)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:1080px;height:1350px;font-family:Poppins,sans-serif;background:#1565d8;overflow:hidden}
  .frame{position:absolute;inset:22px;background:#fdfdfd;border-radius:46px;overflow:hidden}
  .frame:before{content:"";position:absolute;inset:18px;border:3px dashed #9cc4f2;border-radius:34px}
  .top{position:absolute;top:58px;left:64px;right:64px;display:flex;justify-content:space-between;align-items:center}
  .cat{background:#e7f0fd;color:#1565d8;font-weight:700;font-size:22px;padding:8px 20px;border-radius:40px;letter-spacing:1px}
  .logo{height:84px}
  .name{position:absolute;top:140px;left:64px;right:64px}
  .name h1{font-weight:800;font-size:68px;line-height:1.05;color:#14213d}
  .name p{font-size:28px;color:#5b6475;margin-top:8px}
  .photo{position:absolute;top:320px;left:64px;right:64px;height:660px;display:flex;align-items:center;justify-content:center}
  .photo img{max-height:100%;max-width:100%;object-fit:contain;filter:drop-shadow(0 18px 24px rgba(20,33,61,.18))}
  .prices{position:absolute;top:1000px;left:64px;right:64px;display:flex;gap:20px}
  .pr{flex:1;border-radius:26px;padding:18px 26px;background:#eef4fd;border:3px solid #d3e3fa}
  .pr.main{background:#1565d8;border-color:#1565d8}
  .pr.main .lbl{color:#d6e6fb}
  .pr.main .val{color:#fff}
  .pr .lbl{font-size:24px;font-weight:600;color:#3d4659}
  .pr .val{font-size:52px;font-weight:800;color:#14213d;line-height:1.1}
  .pr .note{font-size:20px;color:#5b6475}
  .foot{position:absolute;bottom:52px;left:64px;right:64px;border-top:2px dashed #c9dcf5;padding-top:18px;display:grid;grid-template-columns:1fr 1fr;row-gap:12px;column-gap:24px}
  .foot div{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:600;color:#2b3447}
  .foot img,.foot .fb{width:30px;height:30px;border-radius:7px;flex:none}
  .foot .fb{background:#1877f2;color:#fff;font:800 24px/34px Poppins,sans-serif;text-align:center;overflow:hidden}
  .doodle{position:absolute;color:#7fb3ee;font-size:64px;opacity:.7}
</style></head>
<body><div class="frame">
  <div class="doodle" style="top:360px;right:70px">☆</div>
  <div class="doodle" style="top:820px;left:60px;font-size:52px">♡</div>
  <div class="top"><span class="cat">{kategori}</span><img class="logo" src="{assets}/logo.png"></div>
  <div class="name"><h1>{nama}</h1><p>{detail}</p></div>
  <div class="photo"><img src="{gambar}"></div>
  <div class="prices">{harga_html}</div>
  <div class="foot">
    <div><img src="{assets}/ic_wa.png">{wa}</div>
    <div><img src="{assets}/ic_ig.png">{ig}</div>
    <div><span class="fb">f</span>{fb}</div>
    <div><img src="{assets}/ic_tt.png">{tiktok}</div>
  </div>
</div></body></html>
